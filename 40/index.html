<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <div class="auth-form">
        <h1 class="header">Build a better business through education.</h1>
        <p class="subtitle">Sign up below to get started on Teachable.</p>

        <form action="" class="form">
            <label for="name" class="label">
                <span class="labelText">Name</span>
                <input type="text" name="" id="name" class="input">
            </label>

            <label for="email" class="label">
                <span class="labelText">Email</span>
                <input type="email" name="" id="email" class="input">
            </label>

            <label for="password" class="label">
                <span class="labelText">Set password</span>
                <input type="password" name="" id="password" class="input">
            </label>

            <label for="termsOfUse" class="termsOfUseLabel">
                <input type="checkbox" name="" id="termsOfUse" class="checkbox">
                <span>By signing up, you agree to the</span> 
                <a href="#" class="termsOfUseLink">Terms of Use</a>
                <span>and</span>
                <a href="#" class="termsOfUseLink">Privacy Policy</a>
            </label>

            <input type="submit" value="Create an account" class="submitButton">
        </form>

        <p class="alreadyHave">Already have an account? <a href="#" class="alreadyHaveLink">Log In</a></p>
    </div>
</body>
</html>
