<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <!-- read input -->
    1.
    <br>
    <input type="text" id="readInputInput">
    <div id="readInputBlock">empty</div>
    <br>

    <!-- delay -->
    2.
    <br>
    <span id="delayBlock">0</span>seconds left
    <br>

    <!-- fade in -->
    3. 
    <br>
    <span class="pulse">pulse phrase</span>
    <br>
    <div class="fadeInBlock" id="fadeInBlock">fade in chars</div>


    <!-- pulse -->
    <div class="pulseCharsBlock" id="pulseCharsBlock">pulse chars</div>

    <!-- color cycle -->
    4.
    <br>
    <div class="colorCycleBlock" id="colorCycleBlock">Color cycling text</div>
    <br>

    <!-- typewriter -->
    5.
    <br>
    <div class="typewriterBlock" id="typewriterBlock"></div>
    <br>

    <!-- floating -->
    6.
    <br>
    <div class="floatingBlock" id="floatingBlock" style="width: 50px; height: 50px; background-color: lightblue; position: relative;">Float</div>

    <script src="script.js"></script>
</body>
</html>
