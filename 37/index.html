<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<body>
    <form class="form" action="/google.con">
        <label>
            Input text
            <input type="text" placeholder="VIktar" required maxlength="10" minlength="3">
        </label>

        <label>
            Input password
            <input type="password" name="" >
        </label>


        <label>
            Input email
            <input type="email" name="user_email" readonly value="viktar@goog.com">
        </label>


        <label for="">
            Input number
            <input type="number" name="age" min="1" max="100" step="0.5">
        </label>

        <label >
            Input tel
            <input type="tel" name="">
        </label>

        <label >
            Input url
            <input type="url" name="website">
        </label>

        <label>
            INput date
            <input type="date" name="birthday">
        </label>


        <label>
            Input color picker
            <input type="color" name="favcolor">
        </label>

        <label>
            Input checkbox
            <input type="checkbox" name="subscribe" value="yes">
        </label>


        <label>
            Input radio
            <input type="radio" name="gender" value="male"> Мужской
            <input type="radio" name="gender" value="female"> Женский
        </label>


        <label>
            Input file
            <input type="file" name="avatar" multiple>
        </label>


        <input type="submit" value="Отправить">

        <input type="reset" value="Сбросить">


        <input type="hidden" name="session_id" value="12345">




        <!-- <label for="input-password">Input password</label>
        <input type="password" name="" id="input-password"> -->
    </form>
    
</body>
</html>
