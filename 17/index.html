<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./style.css">
    <title>Document</title>
</head>
<body>
    <h2>Header 1 block</h2>

    <form action="index.html?" id="myForm" method="get" autocomplete="on">


        <fieldset>
            <legend>First fieldset</legend>
            <label for="firstInput">label for the first input</label>
            <input type="text" placeholder="Ivan, Vasyl, Viktar" id="firstInput" name="firstName" required value="">
            
            <br>
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname" readonly value="Test surname">

            <br>
            <input type="number" pattern="[0-9]{5}">
        </fieldset>

        <div class="form-group">
            <input type="checkbox" id="agree">
            <label for="agree">Я согласен с условиями использования</label>
        
        
            <input type="radio" id="radio">
            <label for="radio">Radio</label>

            <input type="password">

            <input type="number">


            <select name="" id="">
                <option value="1">first</option>
                <option value="2">second</option>
                <option value="3">third</option>
            </select>


            <input type="date">
            <input type="color">
        </div>


        <fieldset>
            <legend>First fieldset</legend>
            <label for="firstInput">label for the first input</label>
            <input type="text" placeholder="enter your name" id="firstInput" name="firstName">
            
            <br>
            <label for="surname">Surname</label>
            <input type="text" id="surname" name="surname">
        </fieldset>

        <button type="submit">Super</button>
    </form>





    <form class="second-form">
        <div class="form-group">
            <label for="telephone">Телефон:</label>
            <input 
                type="tel" 
                id="telephone"
                name="phone" 
                placeholder="+7 (XXX) XXX-XX-XX"
                pattern="\+7\s?[0-9]{3}\s?[0-9]{3}-[0-9]{2}-[0-9]{2}"
                required
            >
            <p class="hint">Формат: +7 XXX XXX-XX-XX</p>
        </div>

        <div class="form-group">
            <label for="age">Возраст:</label>
            <input 
                type="number"
                id="age"
                name="age" 
                min="18"
                max="120"
                value="18"
            >
        </div>

        <div class="form-group">
            <label>Способ связи:</label>
            <select name="contact_method" required>
                <option value="" disabled selected>Выберите вариант</option>
                <option value="email">Email</option>
                <option value="phone">Телефон</option>
            </select>
        </div>

        <input type="submit" value="submit form!">
    </form>


</body>
</html>
